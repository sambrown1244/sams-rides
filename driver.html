<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Sam's Rides Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<style>
  .head { background: var(--ink-btn); color: var(--ink-btn-fg); padding-block: calc(16px + env(safe-area-inset-top, 0px)) 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  .head h1 { font-size: 26px; }
  .head .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; opacity: .8; }
  .head .refresh { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: rgba(127,127,127,.18); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
  .body { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
  .card.new { border: 2px solid var(--fg); }
  .card .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .card .who { font-size: 19px; font-weight: 800; }
  .card .when { color: var(--muted); font-size: 13px; }
  .pill { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .pill.round { background: var(--ink-btn); color: var(--ink-btn-fg); }
  .legs { display: grid; gap: 8px; }
  .leg { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 15px; }
  .leg dt { color: var(--muted); }
  .leg dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .note { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; }
  .statuses { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
  .statuses button { border: 0; background: var(--chip); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .statuses button[aria-pressed="true"] { background: var(--ink-btn); color: var(--ink-btn-fg); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; line-height: 1.5; }
  .keybox { display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Driver: your rides</h1>
    <div class="tiles">
      <div class="tile"><b id="tNew">–</b><span>New</span></div>
      <div class="tile"><b id="tOpen">–</b><span>To do</span></div>
      <div class="tile"><b id="tRiders">–</b><span>Riders</span></div>
    </div>
    <div class="meta"><span id="updated">Loading…</span><button class="refresh" id="refresh" type="button">Refresh</button></div>
  </header>

  <main class="body">
    <div class="keybox" id="keybox" hidden>
      <p class="sub" style="margin:0">Open this page with the private driver link from your setup steps. It ends in <b>?key=…</b></p>
    </div>
    <div class="actions">
      <a class="mini ghost" id="partyNav" target="_blank" rel="noopener">Directions to the party</a>
    </div>
    <div class="tabs chips" role="group" aria-label="Show">
      <button type="button" data-tab="open" aria-pressed="true">To do</button>
      <button type="button" data-tab="done" aria-pressed="false">Done</button>
      <button type="button" data-tab="all" aria-pressed="false">All</button>
    </div>
    <p class="err" id="err" hidden></p>
    <div id="list" style="display:grid;gap:12px"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CFG = window.SAMS_RIDES;
const $ = id => document.getElementById(id);
const TRIP = { round: "There & back", to: "To party", home: "Home" };
const STATUSES = ["New", "Confirmed", "Picked up", "Done", "Canceled"];
const OPEN = new Set(["New", "Confirmed", "Picked up"]);
let rides = [], tab = "open";

function getKey() {
  const k = new URLSearchParams(location.search).get("key");
  try { if (k) localStorage.setItem("sr_driver_key", k); return k || localStorage.getItem("sr_driver_key") || ""; }
  catch { return k || ""; }
}
const KEY = getKey();

const appleMaps = a => "https://maps.apple.com/?daddr=" + encodeURIComponent(a);
const googleMaps = a => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(a);
$("partyNav").href = appleMaps(CFG.PARTY_ADDR);

function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

async function load() {
  if (!CFG.BOOKING_URL) { showErr("The booking link isn't set up yet. Add your Apps Script URL to config.js."); return; }
  if (!KEY) { $("keybox").hidden = false; $("updated").textContent = "No driver key"; return; }
  try {
    const res = await fetch(`${CFG.BOOKING_URL}?key=${encodeURIComponent(KEY)}`);
    const j = await res.json();
    if (!j.ok) { showErr(j.error === "bad key" ? "That driver key doesn't match the one in your Google Sheet script." : "Couldn't load rides: " + j.error); return; }
    rides = j.rides.sort((a, b) => String(b.created).localeCompare(String(a.created)));
    $("err").hidden = true;
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    render();
  } catch {
    showErr("Couldn't reach your Google Sheet. Check your connection and tap Refresh.");
  }
}
function showErr(t) { $("err").textContent = t; $("err").hidden = false; $("updated").textContent = "Not updated"; }

async function setStatus(id, status) {
  const r = rides.find(x => x.id === id); if (!r) return;
  const prev = r.status; r.status = status; render();
  try {
    const res = await fetch(`${CFG.BOOKING_URL}?key=${encodeURIComponent(KEY)}&action=status&id=${encodeURIComponent(id)}&status=${encodeURIComponent(status)}`);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    toast(`${r.name}: ${status}`);
  } catch {
    r.status = prev; render(); toast("Couldn't save. Try again");
  }
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function link(text, href, cls) { const a = el("a", cls || "mini", text); a.href = href; if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; } return a; }

function render() {
  const open = rides.filter(r => OPEN.has(r.status));
  $("tNew").textContent = rides.filter(r => r.status === "New").length;
  $("tOpen").textContent = open.length;
  $("tRiders").textContent = open.reduce((n, r) => n + (Number(r.riders) || 1), 0);

  const shown = tab === "all" ? rides : tab === "open" ? open : rides.filter(r => !OPEN.has(r.status));
  const list = $("list"); list.innerHTML = "";
  if (!shown.length) {
    list.append(el("div", "empty", tab === "open" ? "No rides to do yet. New bookings show up here and in your email." : "Nothing here yet."));
    return;
  }
  for (const r of shown) {
    const c = el("article", "card" + (r.status === "New" ? " new" : ""));
    const top = el("div", "top");
    const who = el("div"); who.append(el("div", "who", r.name));
    const created = r.created ? new Date(r.created) : null;
    who.append(el("div", "when", created ? "Booked " + created.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : ""));
    top.append(who, el("span", "pill" + (r.trip === "round" ? " round" : ""), TRIP[r.trip] || r.trip));
    c.append(top);

    const legs = el("dl", "legs"); legs.style.margin = "0";
    const add = (k, v) => { if (!v) return; const d = el("div", "leg"); d.append(el("dt", null, k), el("dd", null, v)); legs.append(d); };
    add(r.trip === "home" ? "Drop off" : "Pick up", r.address);
    add("Pickup time", r.pickupTime);
    if (r.trip === "round") add("Ride home", r.returnTime);
    add("Riders", String(r.riders));
    c.append(legs);

    if (r.note) c.append(el("div", "note", "“" + r.note + "”"));

    const acts = el("div", "actions");
    acts.append(link("Apple Maps", appleMaps(r.address)), link("Google Maps", googleMaps(r.address), "mini ghost"));
    if (r.phone) {
      const digits = String(r.phone).replace(/[^\d+]/g, "");
      acts.append(link("Text " + r.name.split(" ")[0], "sms:" + digits, "mini ghost"), link("Call", "tel:" + digits, "mini ghost"));
    }
    c.append(acts);

    const st = el("div", "statuses");
    for (const s of STATUSES) {
      const b = el("button", null, s); b.type = "button";
      b.setAttribute("aria-pressed", r.status === s);
      b.onclick = () => { if (r.status !== s) setStatus(r.id, s); };
      st.append(b);
    }
    c.append(st);
    list.append(c);
  }
}

document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("refresh").onclick = load;
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
